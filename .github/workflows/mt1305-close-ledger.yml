name: MT-1305 close ledger

on:
  push:
    paths:
      - ".github/workflows/mt1305-close-ledger.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ralph/mt-1305-linux-packaging
      - name: Mark MT-1305 complete and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("docs/MAME_TAURI_TODO_2026-09-08.md"); t=p.read_text(); old="## MT-1305 — Linux packaging\n\n- [ ] choose initial package formats.\n- [ ] runtime dependency strategy.\n- [ ] X11/Wayland qualification notes.\n"; new="## MT-1305 — Linux packaging\n\n- [x] choose initial package formats.\n- [x] runtime dependency strategy.\n- [x] X11/Wayland qualification notes.\n"; assert old in t, "MT-1305 ledger block did not match expected open state"; p.write_text(t.replace(old,new,1))'
          rm .github/workflows/mt1305-close-ledger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MAME_TAURI_TODO_2026-09-08.md .github/workflows/mt1305-close-ledger.yml
          git diff --cached --check
          git commit -m "docs: close MT-1305 Linux packaging"
          git push origin HEAD:ralph/mt-1305-linux-packaging
