name: MT-1305 close ledger

on:
  push:
    paths:
      - ".github/workflows/mt1305-close-ledger.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ralph/mt-1305-linux-packaging
      - name: Mark MT-1305 complete and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/MAME_TAURI_TODO_2026-09-08.md")
          text = path.read_text()
          old = """## MT-1305 — Linux packaging

- [ ] choose initial package formats.
- [ ] runtime dependency strategy.
- [ ] X11/Wayland qualification notes.
"""
          new = """## MT-1305 — Linux packaging

- [x] choose initial package formats.
- [x] runtime dependency strategy.
- [x] X11/Wayland qualification notes.
"""
          if old not in text:
              raise SystemExit("MT-1305 ledger block did not match expected open state")
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/mt1305-close-ledger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MAME_TAURI_TODO_2026-09-08.md .github/workflows/mt1305-close-ledger.yml
          git diff --cached --check
          git commit -m "docs: close MT-1305 Linux packaging"
          git push origin HEAD:ralph/mt-1305-linux-packaging
