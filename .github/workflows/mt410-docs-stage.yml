name: MT-410 docs stage

on:
  push:
    branches:
      - ralph/mt-410-docs-stage
    paths:
      - .github/workflows/mt410-docs-stage.yml

permissions:
  contents: write

jobs:
  close-todo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ralph/mt-410-docs-stage
          sparse-checkout: docs
      - name: Close exactly MT-410
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/MAME_TAURI_TODO_2026-09-08.md")
          text = path.read_text()
          old = """## MT-410 — Library UX performance qualification

          - [ ] measure startup catalog load.
          - [ ] measure search latency.
          - [ ] test full catalog.
          - [ ] confirm bounded DOM/render workload.
          """
          new = """## MT-410 — Library UX performance qualification

          - [x] measure startup catalog load.
          - [x] measure search latency.
          - [x] test full catalog.
          - [x] confirm bounded DOM/render workload.
          """
          if text.count(old) != 1:
              raise SystemExit("expected exactly one open MT-410 block")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit TODO closure
        run: |
          git add -u docs/MAME_TAURI_TODO_2026-09-08.md
          git diff --cached --check
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: close MT-410 library UX performance qualification"
          git push origin HEAD:ralph/mt-410-docs-stage
