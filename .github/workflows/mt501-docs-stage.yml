name: MT-501 docs stage

on:
  push:
    branches:
      - ralph/mt-501-docs-stage

permissions:
  contents: write

jobs:
  close-mt501:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Close exactly MT-501 and record qualification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          todo_path = Path('docs/MAME_TAURI_TODO_2026-09-08.md')
          todo = todo_path.read_text()
          start = todo.index('## MT-501 — Define path configuration model')
          end = todo.index('## MT-502 — Expose path configuration UI', start)
          section = todo[start:end]
          targets = [
              '- [ ] ROM paths.',
              '- [ ] software paths.',
              '- [ ] CHD-related paths where applicable.',
              '- [ ] platform-safe path representation.',
              '- [ ] validation and permissions errors.',
          ]
          for target in targets:
              if section.count(target) != 1:
                  raise SystemExit(f'expected exactly one MT-501 checkbox: {target!r}')
              section = section.replace(target, target.replace('[ ]', '[x]'), 1)
          todo = todo[:start] + section + todo[end:]
          mt502 = todo[end:end + 400]
          if '- [ ] choose path through native dialog.' not in mt502:
              raise SystemExit('MT-502 unexpectedly changed while closing MT-501')
          todo_path.write_text(todo)

          evidence_path = Path('docs/MAME_TAURI_MT501_PATH_CONFIGURATION_MODEL_2026-09-09.md')
          evidence = evidence_path.read_text()
          marker = '## Qualification evidence'
          if marker in evidence:
              raise SystemExit('qualification evidence already present')
          evidence += '''\n## Qualification evidence\n\nThe finalized implementation source tree is `07e5ec9f26bc16eaa49bf813c06365186ce3f3ea`. GitHub Actions Tauri run `34418697878` completed successfully against that exact tree at pre-squash commit `aa066ef753bed2a61a437cd44a09c31d29c571e9`. The clean implementation commit `54582a87053d4a0f9aa631847ae211002bfcc5bb` points to the same tree, with MT-410 closure `611717bc9635202bbb4a073945fbebc4ae582c85` as its single parent.\n\nThe successful qualification covered frontend formatting, linting, typechecking, 27 frontend tests, production build, Rust formatting, the full Rust test suite, the inherited 100,000-row MT-410 performance guard, Clippy with warnings denied, and lockfile integrity.\n\nThe Linux CI exercises UTF-8 and lossless non-UTF-8 Unix path serialization. The Windows `windowsWideHex` representation is platform-gated source in this task; Windows-target execution should be added when cross-platform CI is introduced.\n'''
          evidence_path.write_text(evidence)
          PY

          rm .github/workflows/mt501-docs-stage.yml

      - name: Commit staged closure
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MAME_TAURI_TODO_2026-09-08.md docs/MAME_TAURI_MT501_PATH_CONFIGURATION_MODEL_2026-09-09.md .github/workflows/mt501-docs-stage.yml
          git diff --cached --check
          git commit -m 'docs: close MT-501 path configuration model'
          git push
