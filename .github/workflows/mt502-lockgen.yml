name: MT-502 lockfile generation

on:
  push:
    branches:
      - ralph/mt-502-lockgen

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve Cargo lockfile
        working-directory: tauri/src-tauri
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit resolved Cargo lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tauri/src-tauri/Cargo.lock
          git commit -m "chore: resolve MT-502 dialog lockfile [skip ci]"
          git push
