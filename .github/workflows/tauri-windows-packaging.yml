name: Tauri Windows packaging

on:
  push:
    paths:
      - ".github/workflows/tauri-windows-packaging.yml"
      - "tauri/**"
      - "scripts/tauri/**"
  pull_request:
    paths:
      - ".github/workflows/tauri-windows-packaging.yml"
      - "tauri/**"
      - "scripts/tauri/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-nsis-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tauri
            scripts/tauri

      - name: Stage synthetic MT-1303 MAME runtime
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          fixture=.mt1303-fixture
          rm -rf "$fixture" tauri/src-tauri/bundle-resources/mame-runtime
          mkdir -p \
            "$fixture/source/hash" \
            "$fixture/source/bgfx/chains" \
            "$fixture/source/docs/legal"
          printf '<softwarelist name="fixture"/>\n' > "$fixture/source/hash/fixture.xml"
          printf 'bgfx fixture\n' > "$fixture/source/bgfx/chains/fixture.json"
          printf 'MAME COPYING fixture\n' > "$fixture/source/COPYING"
          printf 'GPL fixture\n' > "$fixture/source/docs/legal/GPL-2.0"
          printf 'MT-1303 synthetic packaging payload; not a release MAME executable\n' > "$fixture/mame.exe"
          ./scripts/tauri/stage-mame-runtime.sh \
            "$fixture/source" \
            "$fixture/mame.exe" \
            tauri/src-tauri/bundle-resources/mame-runtime

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies and Windows release build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/src-tauri/target/debug
            tauri/src-tauri/target/release
          key: ${{ runner.os }}-tauri-windows-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('tauri/src-tauri/Cargo.lock', 'tauri/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-tauri-windows-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Install frontend dependencies from lockfile
        run: npm ci

      - name: Validate bundled runtime paths on Windows
        working-directory: tauri/src-tauri
        run: cargo test --locked bundled_runtime

      - name: Build NSIS package
        run: npm run tauri -- build --bundles nsis

      - name: Clean install, packaged-path, and clean uninstall smoke
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem \
            "tauri/src-tauri/target/release/bundle/nsis" \
            -Filter "*-setup.exe" \
            -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer was not produced"
          }
          ./scripts/tauri/test-windows-nsis-install.ps1 -InstallerPath $installer.FullName

      - name: Verify lockfiles remain unchanged
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
