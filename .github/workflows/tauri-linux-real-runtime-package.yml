name: Tauri Linux real runtime package

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
    paths:
      - ".github/workflows/tauri-linux-real-runtime-package.yml"
      - "tauri/**"
      - "scripts/tauri/**"
      - "makefile"
      - "scripts/**"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-linux-real-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-runtime-deb-appimage-qualification:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      MAME_TAURI_MAME_BUILD_JOBS: "2"
      MAME_TAURI_MAME_SUBTARGET: "mame"
      MAME_TAURI_REAL_RUNTIME_SMOKE_MACHINE: "pacman"
      MAME_TAURI_REQUIRE_ARCADE_DRIVERS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install MAME, Tauri, and package qualification prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            clang \
            curl \
            file \
            git \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libfontconfig1-dev \
            libfuse2 \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libpulse-dev \
            librsvg2-dev \
            libsdl2-dev \
            libsdl2-ttf-dev \
            libssl-dev \
            libutf8proc-dev \
            libwebkit2gtk-4.1-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            patchelf \
            pkg-config \
            python3 \
            wget \
            xdotool \
            xvfb

      - name: Configure compiler cache
        shell: bash
        run: |
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >>"$GITHUB_ENV"
          echo "USE_CCACHE=1" >>"$GITHUB_ENV"
          ccache --set-config=max_size=5G

      - name: Cache MAME compiler output
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ${{ runner.os }}-real-mame-${{ github.sha }}-${{ env.MAME_TAURI_MAME_SUBTARGET }}
          restore-keys: |
            ${{ runner.os }}-real-mame-${{ env.MAME_TAURI_MAME_SUBTARGET }}-
            ${{ runner.os }}-real-mame-

      - name: Build real MAME runtime from repository source
        shell: bash
        run: |
          set -euo pipefail
          jobs=${MAME_TAURI_MAME_BUILD_JOBS:-2}
          subtarget=${MAME_TAURI_MAME_SUBTARGET:-mame}
          echo "Building real MAME runtime with SUBTARGET=$subtarget jobs=$jobs"

          runtime_candidates=(
            "./mame"
            "./mame_${subtarget}"
            "./mame${subtarget}"
            "./build/linux_gcc/bin/x64/Release/mame_${subtarget}"
            "./build/linux_gcc/bin/x64/Release/mame${subtarget}"
          )

          discover_runtime_candidates() {
            local candidate
            for candidate in "${runtime_candidates[@]}"; do
              [[ -f "$candidate" ]] && printf '%s\n' "$candidate"
            done
            find . -maxdepth 8 -type f \( -name "mame_${subtarget}" -o -name "mame${subtarget}" -o -name mame \) -perm -111 -print 2>/dev/null || true
          }

          probe_runtime_candidate() {
            local candidate size_before size_after file_log
            while IFS= read -r candidate; do
              [[ -x "$candidate" && -f "$candidate" ]] || continue
              size_before=$(stat -c '%s' "$candidate" 2>/dev/null || printf '0')
              [[ "$size_before" -gt 1048576 ]] || continue
              sleep 2
              size_after=$(stat -c '%s' "$candidate" 2>/dev/null || printf '0')
              [[ "$size_before" == "$size_after" ]] || continue

              file_log=$(file "$candidate" 2>/dev/null || true)
              echo "Runtime candidate file signature: $file_log"
              if grep -Eq 'ELF .*(executable|shared object)' <<<"$file_log" && ! grep -Eiq 'shell script|text|synthetic|fixture|MT-1305' <<<"$file_log"; then
                runtime="$candidate"
                echo "Found linked real MAME runtime candidate: $runtime"
                return 0
              fi
              echo "Candidate is not yet a linked real MAME runtime: $candidate" >&2
            done < <(discover_runtime_candidates | awk '!seen[$0]++')
            return 1
          }

          build_log=$(mktemp)
          runtime=
          build_pid=
          cleanup_build() {
            if [[ -n "${build_pid:-}" ]] && kill -0 "$build_pid" 2>/dev/null; then
              kill -TERM -- "-$build_pid" 2>/dev/null || kill -TERM "$build_pid" 2>/dev/null || true
              for _ in {1..10}; do
                if ! kill -0 "$build_pid" 2>/dev/null; then
                  wait "$build_pid" 2>/dev/null || true
                  build_pid=
                  return 0
                fi
                sleep 1
              done
              kill -KILL -- "-$build_pid" 2>/dev/null || kill -KILL "$build_pid" 2>/dev/null || true
              wait "$build_pid" 2>/dev/null || true
              build_pid=
            fi
          }
          trap cleanup_build EXIT

          setsid make -j"$jobs" NOWERROR=1 TOOLS=0 TESTS=0 USE_QTDEBUG=0 SUBTARGET="$subtarget" > >(tee "$build_log") 2>&1 &
          build_pid=$!

          while kill -0 "$build_pid" 2>/dev/null; do
            if probe_runtime_candidate; then
              echo "Stopping top-level MAME build after linked runtime candidate appeared: $runtime"
              cleanup_build
              break
            fi
            sleep 5
          done

          if [[ -z "$runtime" ]]; then
            if wait "$build_pid"; then
              build_pid=
              probe_runtime_candidate || {
                echo "MAME build completed but no linked runtime executable was found" >&2
                find . -maxdepth 8 -type f \( -name 'mame' -o -name 'mame_*' -o -name 'mame*' \) -perm -111 -print >&2 || true
                exit 1
              }
            else
              status=$?
              build_pid=
              echo "MAME build exited with status $status before a linked runtime was available" >&2
              echo "--- last MAME build log lines ---" >&2
              tail -n 200 "$build_log" >&2 || true
              echo "--- runner memory ---" >&2
              free -h >&2 || true
              echo "--- runner disk ---" >&2
              df -h . "$RUNNER_TEMP" >&2 || true
              echo "--- ccache stats ---" >&2
              ccache -s >&2 || true
              echo "--- partial runtime outputs ---" >&2
              find . -maxdepth 8 -type f \( -name 'mame' -o -name 'mame_*' -o -name 'mame*' \) -perm -111 -print >&2 || true
              exit "$status"
            fi
          fi

          trap - EXIT
          cleanup_build
          ./scripts/tauri/validate-real-mame-runtime.sh "$runtime"
          ./scripts/tauri/validate-release-driver-coverage.sh "$runtime"
          printf 'MAME_TAURI_REAL_RUNTIME_EXECUTABLE=%s/%s\n' "$PWD" "${runtime#./}" >>"$GITHUB_ENV"

      - name: Verify headless real-MAME frame capture
        shell: bash
        run: ./scripts/tauri/test-real-mame-headless-frame.sh "$MAME_TAURI_REAL_RUNTIME_EXECUTABLE"

      - name: Stage release-qualified bundled runtime
        shell: bash
        env:
          MAME_TAURI_REAL_RUNTIME_SOURCE_ROOT: ${{ github.workspace }}
        run: >-
          ./scripts/tauri/prepare-bundled-mame-runtime.sh
          tauri/src-tauri/bundle-resources/mame-runtime

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies and Linux release build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/src-tauri/target/debug
            tauri/src-tauri/target/release
          key: ${{ runner.os }}-tauri-real-linux-package-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('tauri/src-tauri/Cargo.lock', 'tauri/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-tauri-real-linux-package-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Install frontend dependencies from lockfile
        working-directory: tauri
        run: npm ci

      - name: Validate bundled runtime paths on Linux
        working-directory: tauri/src-tauri
        run: cargo test --locked bundled_runtime

      - name: Build Debian package and AppImage with real bundled MAME
        working-directory: tauri
        run: >-
          npm run tauri -- build
          --config src-tauri/tauri.linux-bundle.conf.json
          --bundles deb,appimage

      - name: Declare bundled MAME runtime dependencies in Debian package
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find tauri/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -type f -print -quit)
          runtime=tauri/src-tauri/bundle-resources/mame-runtime/bin/mame
          [[ -n "$deb" ]] || { echo "Debian package was not produced" >&2; exit 1; }
          [[ -x "$runtime" ]] || { echo "staged bundled MAME executable is missing or non-executable: $runtime" >&2; exit 1; }
          ./scripts/tauri/augment-deb-runtime-deps.sh "$deb" "$runtime"

      - name: Real bundled runtime package qualification
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find tauri/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -type f -print -quit)
          appimage=$(find tauri/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -type f -print -quit)
          [[ -n "$deb" ]] || { echo "Debian package was not produced" >&2; exit 1; }
          [[ -n "$appimage" ]] || { echo "AppImage was not produced" >&2; exit 1; }
          ./scripts/tauri/test-real-linux-package.sh "$deb" "$appimage"
          ./scripts/tauri/test-real-linux-package-metadata-bootstrap.sh "$deb"

      - name: Verify lockfiles remain unchanged
        working-directory: tauri
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock

      - name: Upload tagged Debian package and AppImage
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: real-bundled-mame-linux-packages-${{ github.ref_name }}
          path: |
            tauri/src-tauri/target/release/bundle/deb/*.deb
            tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
