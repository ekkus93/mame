name: MT-1303 ledger close

on:
  push:
    branches: [ralph/mt-1303-windows-packaging]
    paths: [.github/workflows/mt1303-ledger-close.yml]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Mark MT-1301 through MT-1303 complete
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/MAME_TAURI_TODO_2026-09-08.md')
          s = p.read_text()
          blocks = [
              ('## MT-1301 — Define developer executable modes', '## MT-1302 — Bundle required MAME resources correctly'),
              ('## MT-1302 — Bundle required MAME resources correctly', '## MT-1303 — Windows packaging'),
              ('## MT-1303 — Windows packaging', '## MT-1304 — macOS packaging'),
          ]
          for start, end in blocks:
              a = s.index(start)
              b = s.index(end, a)
              section = s[a:b].replace('- [ ]', '- [x]')
              s = s[:a] + section + s[b:]
          p.write_text(s)
          PY
      - name: Commit completion ledger
        run: |
          set -euo pipefail
          git rm .github/workflows/mt1303-ledger-close.yml
          git add docs/MAME_TAURI_TODO_2026-09-08.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: mark MT-1301 through MT-1303 complete'
          git push origin HEAD:ralph/mt-1303-windows-packaging
