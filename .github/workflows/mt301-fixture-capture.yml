name: MT-301 listxml fixture capture

on:
  push:
    paths:
      - ".github/workflows/mt301-fixture-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MT301_EXPECTED_MAME_VERSION: "0.264 (unknown)"
  MT301_EXPECTED_PACKAGE_VERSION: "0.264+dfsg.1-1"

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned fixture-source MAME package
        run: |
          sudo apt-get update
          sudo apt-get install -y "mame=${MT301_EXPECTED_PACKAGE_VERSION}"

      - name: Capture bounded representative listxml fixture
        shell: bash
        run: |
          set -euo pipefail
          MAME_BIN="$(command -v mame)"
          MAME_VERSION="$($MAME_BIN -noreadconfig -version | head -n 1)"
          PACKAGE_VERSION="$(dpkg-query -W -f='${Version}' mame)"
          test "$MAME_VERSION" = "$MT301_EXPECTED_MAME_VERSION"
          test "$PACKAGE_VERSION" = "$MT301_EXPECTED_PACKAGE_VERSION"
          export MAME_BIN MAME_VERSION PACKAGE_VERSION

          python3 - <<'PY'
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          names = ["galaxian", "galaxiana", "apple2e", "z80"]
          mame = os.environ["MAME_BIN"]
          root_attrs = None
          captured = []

          machine_attrs = {
              "name", "sourcefile", "cloneof", "romof", "isbios", "isdevice",
              "ismechanical", "runnable",
          }
          child_attrs = {
              "chip": {"type", "tag", "name", "clock"},
              "display": {"tag", "type", "rotate", "width", "height", "refresh", "pixclock"},
              "driver": {
                  "status", "emulation", "cocktail", "savestate", "requiresartwork",
                  "unofficial", "nosoundhardware", "incomplete",
              },
              "softwarelist": {"tag", "name", "status", "filter"},
              "device": {"type", "tag", "fixed_image", "mandatory", "interface"},
          }

          def selected_attrs(source, allowed):
              return {key: value for key, value in source.attrib.items() if key in allowed}

          def project_machine(source):
              target = ET.Element("machine", selected_attrs(source, machine_attrs))
              for child in source:
                  if child.tag in {"description", "year", "manufacturer"}:
                      projected = ET.SubElement(target, child.tag)
                      projected.text = child.text
                  elif child.tag in {"chip", "display", "driver", "softwarelist"}:
                      ET.SubElement(target, child.tag, selected_attrs(child, child_attrs[child.tag]))
                  elif child.tag == "device":
                      projected_device = ET.SubElement(
                          target, "device", selected_attrs(child, child_attrs["device"])
                      )
                      for nested in child:
                          if nested.tag == "instance":
                              ET.SubElement(
                                  projected_device,
                                  "instance",
                                  selected_attrs(nested, {"name", "briefname"}),
                              )
                          elif nested.tag == "extension":
                              ET.SubElement(
                                  projected_device,
                                  "extension",
                                  selected_attrs(nested, {"name"}),
                              )
              return target

          for name in names:
              result = subprocess.run(
                  [mame, "-noreadconfig", "-listxml", name],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              root = ET.fromstring(result.stdout)
              if root_attrs is None:
                  root_attrs = dict(root.attrib)
              machine = next(
                  (entry for entry in root.findall("machine") if entry.get("name") == name),
                  None,
              )
              if machine is None:
                  raise SystemExit(f"MAME listxml did not return requested machine {name!r}")
              captured.append(project_machine(machine))

          output_root = ET.Element("mame", root_attrs or {})
          for machine in captured:
              output_root.append(machine)
          ET.indent(output_root, space="  ")

          out = Path("/tmp/listxml-representative.xml")
          ET.ElementTree(output_root).write(out, encoding="utf-8", xml_declaration=True)
          parsed = ET.parse(out).getroot()
          observed = [node.get("name") for node in parsed.findall("machine")]
          if observed != names:
              raise SystemExit(f"unexpected bounded fixture machines: {observed!r}")
          if out.stat().st_size > 32 * 1024:
              raise SystemExit("bounded representative fixture unexpectedly exceeds 32 KiB")
          PY

          printf 'MT301_MAME_VERSION=%s\n' "$MAME_VERSION"
          printf 'MT301_PACKAGE_VERSION=%s\n' "$PACKAGE_VERSION"
          printf 'MT301_RUNNER_IMAGE=%s\n' "ubuntu-24.04"
          printf 'MT301_FIXTURE_SHA256=%s\n' "$(sha256sum /tmp/listxml-representative.xml | awk '{print $1}')"
          printf 'MT301_FIXTURE_BASE64_BEGIN\n'
          base64 -w 76 /tmp/listxml-representative.xml
          printf '\nMT301_FIXTURE_BASE64_END\n'

      - name: Upload captured fixture
        uses: actions/upload-artifact@v4
        with:
          name: mt301-listxml-representative
          path: /tmp/listxml-representative.xml
          if-no-files-found: error
