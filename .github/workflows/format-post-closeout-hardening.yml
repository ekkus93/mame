name: Remove temporary post-closeout formatter

on:
  push:
    branches:
      - ralph/post-closeout-hardening-v4

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
      - name: Remove temporary formatter workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/format-post-closeout-hardening.yml
          git commit -m "ci: remove temporary post-closeout formatter"
          git push origin HEAD:ralph/post-closeout-hardening-v4
