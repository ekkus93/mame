name: Tauri project

on:
  push:
    paths:
      - ".gitattributes"
      - ".github/workflows/tauri-project.yml"
      - "tauri/**"
      - "scripts/tauri/**"
      - "tests/tauri/**"
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/tauri-project.yml"
      - "tauri/**"
      - "scripts/tauri/**"
      - "tests/tauri/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /COPYING
            /3rdparty/README.md
            /docs/legal/
            /docs/MAME_TAURI_TODO_2026-09-08.md
            /docs/MAME_TAURI_MT2200_ENGINEERING_CLOSURE_2026-09-13.md
            /docs/MAME_TAURI_POST_CLOSEOUT_HARDENING_SPEC_2026-09-13.md
            /docs/MAME_TAURI_POST_CLOSEOUT_HARDENING_TODO_2026-09-13.md
            /docs/MAME_TAURI_MAME_UI_REPRODUCTION_SPEC_2026-09-14.md
            /docs/MAME_TAURI_MAME_UI_REPRODUCTION_TODO_2026-09-14.md
            /docs/MAME_TAURI_MAME_UI_PARITY_MATRIX_2026-09-14.md
            /docs/MAME_TAURI_MAME_UI_ACCESSIBILITY_QUALIFICATION_2026-09-15.md
            /docs/MAME_TAURI_MAME_UI_REPRODUCTION_CLOSURE_2026-09-15.md
            /.github/workflows/tauri-project.yml
            /tauri/
            /scripts/tauri/

      - name: MT-1302 bundled runtime staging contract
        working-directory: ${{ github.workspace }}
        run: ./scripts/tauri/test-stage-mame-runtime.sh

      - name: MT-1407 exact-head CI evidence helper regression tests
        working-directory: ${{ github.workspace }}
        run: python3 scripts/tauri/test-report-ci-evidence.py

      - name: MT-1800 cross-platform qualification ledger regression tests
        working-directory: ${{ github.workspace }}
        run: python3 scripts/tauri/test-mt1800-qualification.py

      - name: MT-1900 upstream inventory regression tests
        working-directory: ${{ github.workspace }}
        run: python3 scripts/tauri/test-mt1900-upstream-inventory.py

      - name: MT-2004 release-candidate manifest regression tests
        working-directory: ${{ github.workspace }}
        run: python3 scripts/tauri/test-mt2004-release-candidate.py

      - name: MT-2100 final quality closure ledger regression tests
        working-directory: ${{ github.workspace }}
        run: python3 scripts/tauri/test-mt2100-final-quality-closure.py

      - name: MT-2200 TODO reconciliation regression tests
        working-directory: ${{ github.workspace }}
        run: python3 scripts/tauri/test-mt2200-todo-reconciliation.py

      - name: Post-closeout hardening regression tests
        working-directory: ${{ github.workspace }}
        run: python3 scripts/tauri/test-post-closeout-hardening.py

      - name: Install Tauri Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies and debug build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/src-tauri/target/debug
          key: ${{ runner.os }}-tauri-debug-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('tauri/src-tauri/Cargo.lock', 'tauri/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-tauri-debug-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Generate MT-1307 license inventory
        working-directory: ${{ github.workspace }}
        run: python3 scripts/tauri/generate-license-inventory.py

      - name: Upload MT-1307 license inventory
        uses: actions/upload-artifact@v4
        with:
          name: mame-tauri-license-inventory-${{ github.sha }}
          path: artifacts/license-inventory/
          if-no-files-found: error

      - name: Install frontend dependencies from lockfile
        run: npm ci

      - name: Frontend format check
        run: npm run format:check

      - name: Frontend lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Rust format
        working-directory: tauri/src-tauri
        run: cargo fmt --check

      - name: Rust tests
        working-directory: tauri/src-tauri
        run: cargo test --locked

      - name: Library UX performance qualification
        working-directory: tauri/src-tauri
        run: >-
          cargo test --locked full_catalog_library_queries_meet_interactive_budgets
          -- --ignored --nocapture

      - name: MT-1700 performance artifact schema regression
        working-directory: ${{ github.workspace }}
        run: python3 scripts/tauri/test-performance-qualification.py

      - name: Generate MT-1700 performance baseline artifact
        working-directory: ${{ github.workspace }}
        run: >-
          python3 scripts/tauri/performance_qualification.py
          --write artifacts/performance/mt1700-performance-baseline.json
          --format pretty

      - name: Upload MT-1700 performance baseline
        uses: actions/upload-artifact@v4
        with:
          name: mame-tauri-mt1700-performance-baseline-${{ github.sha }}
          path: artifacts/performance/
          if-no-files-found: error

      - name: Generate MT-1800 cross-platform qualification artifact
        working-directory: ${{ github.workspace }}
        run: >-
          python3 scripts/tauri/mt1800_qualification.py
          --sha ${{ github.sha }}
          --json
          --write artifacts/cross-platform/mt1800-cross-platform-qualification.json

      - name: Upload MT-1800 cross-platform qualification
        uses: actions/upload-artifact@v4
        with:
          name: mame-tauri-mt1800-cross-platform-qualification-${{ github.sha }}
          path: artifacts/cross-platform/
          if-no-files-found: error

      - name: Generate MT-2004 release-candidate manifest
        working-directory: ${{ github.workspace }}
        run: >-
          python3 scripts/tauri/mt2004_release_candidate.py
          --sha ${{ github.sha }}
          --json
          --write artifacts/release/mt2004-release-candidate.json

      - name: Upload MT-2004 release-candidate manifest
        uses: actions/upload-artifact@v4
        with:
          name: mame-tauri-mt2004-release-candidate-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error

      - name: Generate MT-2100 final quality closure ledger
        working-directory: ${{ github.workspace }}
        run: >-
          python3 scripts/tauri/mt2100_final_quality_closure.py
          --sha ${{ github.sha }}
          --previous-qualified-sha 6aa453eb10ace2eaf06e0a284167e68538f0fb48
          --pretty
          --write artifacts/final-quality/mt2100-final-quality-closure.json

      - name: Upload MT-2100 final quality closure ledger
        uses: actions/upload-artifact@v4
        with:
          name: mame-tauri-mt2100-final-quality-closure-${{ github.sha }}
          path: artifacts/final-quality/
          if-no-files-found: error

      - name: Rust clippy
        working-directory: tauri/src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Verify lockfiles remain unchanged
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock

  linux-release-qualification:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/')
    needs: linux-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tauri/
            /scripts/tauri/
            /docs/MAME_TAURI_MAME_UI_REPRODUCTION_SPEC_2026-09-14.md
            /docs/MAME_TAURI_MAME_UI_REPRODUCTION_TODO_2026-09-14.md
            /docs/MAME_TAURI_MAME_UI_PARITY_MATRIX_2026-09-14.md
            /docs/MAME_TAURI_MAME_UI_ACCESSIBILITY_QUALIFICATION_2026-09-15.md
            /docs/MAME_TAURI_MAME_UI_REPRODUCTION_CLOSURE_2026-09-15.md
            /.github/workflows/tauri-project.yml

      - name: Install Tauri Linux runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            xdotool

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Restore Rust dependencies and debug build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/src-tauri/target/debug
          key: ${{ runner.os }}-tauri-debug-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('tauri/src-tauri/Cargo.lock', 'tauri/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-tauri-debug-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Cache Rust release build
        uses: actions/cache@v6
        with:
          path: tauri/src-tauri/target/release
          key: ${{ runner.os }}-tauri-release-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('tauri/src-tauri/Cargo.lock', 'tauri/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-tauri-release-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Install frontend dependencies from lockfile
        run: npm ci

      - name: Tauri production build smoke check
        run: npm run tauri -- build --no-bundle

      - name: Tauri development window smoke check
        run: xvfb-run -a ./scripts/smoke-dev.sh

      - name: Verify lockfiles remain unchanged
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
