name: Tauri project

on:
  push:
    paths:
      - ".github/workflows/tauri-project.yml"
      - "tauri/**"
      - "scripts/tauri/**"
      - "tests/tauri/**"
      - "docs/MAME_TAURI_*"
  pull_request:
    paths:
      - ".github/workflows/tauri-project.yml"
      - "tauri/**"
      - "scripts/tauri/**"
      - "tests/tauri/**"
      - "docs/MAME_TAURI_*"

permissions:
  contents: read

jobs:
  linux-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            xdotool

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install frontend dependencies from lockfile
        run: npm ci

      - name: Frontend format check
        run: npm run format:check

      - name: Frontend lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Rust format
        working-directory: tauri/src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: tauri/src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: tauri/src-tauri
        run: cargo test --locked

      - name: Rust release build
        working-directory: tauri/src-tauri
        run: cargo build --locked --release

      - name: Tauri production build smoke check
        run: npm run tauri -- build --no-bundle

      - name: Tauri development window smoke check
        run: xvfb-run -a ./scripts/smoke-dev.sh

      - name: Verify lockfiles remain unchanged
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
