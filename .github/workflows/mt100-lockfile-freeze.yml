name: MT-100 lockfile freeze

on:
  push:
    branches:
      - ralph/mt-100-closure
    paths:
      - ".github/workflows/mt100-lockfile-freeze.yml"

permissions:
  actions: read
  contents: write

jobs:
  freeze-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ralph/mt-100-closure

      - name: Restore exact lockfiles from qualified CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10069493506/zip" \
            --output /tmp/mt100-lockfiles.zip
          rm -rf /tmp/mt100-lockfiles
          mkdir -p /tmp/mt100-lockfiles
          unzip -q /tmp/mt100-lockfiles.zip -d /tmp/mt100-lockfiles
          cp /tmp/mt100-lockfiles/package-lock.json tauri/package-lock.json
          cp /tmp/mt100-lockfiles/src-tauri/Cargo.lock tauri/src-tauri/Cargo.lock

      - name: Verify qualified lockfile digests
        run: |
          printf '%s  %s\n' \
            'cc9d1593a0c44116579147b4bf432032fe7c2fb196253ebc4e051558c8bac04f' \
            'tauri/package-lock.json' | sha256sum -c -
          printf '%s  %s\n' \
            'ed473c5b2d2b9a90ff0634cdf78fa9ade635a22a14838c079ba39f958df1ea93' \
            'tauri/src-tauri/Cargo.lock' | sha256sum -c -

      - name: Commit exact lockfiles and remove bootstrap workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f tauri/package-lock.json tauri/src-tauri/Cargo.lock
          git rm .github/workflows/mt100-lockfile-freeze.yml
          git commit -m 'build: freeze MT-100 dependency lockfiles'
          git push origin HEAD:ralph/mt-100-closure
